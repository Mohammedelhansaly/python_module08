[project]
name = "matrix-loading"
version = "0.1.0"
description = "Matrix data loading and analysis program"
authors = [
    { name = "Mohammed El Hansaly", email = "elhansalymohammed@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.31"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
